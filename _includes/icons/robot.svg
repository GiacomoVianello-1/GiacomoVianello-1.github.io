<svg class="robot-graphic" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Front LiDAR Perception Fan / Laser Scan Arc -->
    <linearGradient id="robot-scan-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="var(--heading-secondary, #f09228)" stop-opacity="0.28" />
      <stop offset="100%" stop-color="var(--heading-secondary, #f09228)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Front Laser Scanner / Perception Arc Field -->
  <polygon points="50,22 14,0 86,0" fill="url(#robot-scan-gradient)" />

  <!-- Outer Pulsing LiDAR Scan Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="var(--heading-secondary, #f09228)" stroke-width="1.2" stroke-dasharray="3, 4" opacity="0.3" class="robot-scan-ring" />

  <!-- Left Differential Drive Wheel -->
  <rect x="7" y="38" width="8" height="26" rx="2" fill="currentColor" opacity="0.9" />
  <line x1="7" y1="44" x2="15" y2="44" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <line x1="7" y1="51" x2="15" y2="51" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <line x1="7" y1="58" x2="15" y2="58" stroke="#ffffff" stroke-width="1" opacity="0.3" />

  <!-- Right Differential Drive Wheel -->
  <rect x="85" y="38" width="8" height="26" rx="2" fill="currentColor" opacity="0.9" />
  <line x1="85" y1="44" x2="93" y2="44" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <line x1="85" y1="51" x2="93" y2="51" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <line x1="85" y1="58" x2="93" y2="58" stroke="#ffffff" stroke-width="1" opacity="0.3" />

  <!-- Wheel Axle Axis -->
  <line x1="15" y1="51" x2="85" y2="51" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2, 3" opacity="0.45" />

  <!-- Main Circular Chassis Base (TurtleBot / Kobuki Base style) -->
  <circle cx="50" cy="51" r="35" fill="none" stroke="currentColor" stroke-width="2.5" />
  <circle cx="50" cy="51" r="33.5" fill="currentColor" opacity="0.12" />

  <!-- Front Curved Bumper -->
  <path d="M 22,34 A 35,35 0 0,1 78,34" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />

  <!-- Front Caster Wheel Mount -->
  <circle cx="50" cy="24" r="3.2" fill="currentColor" opacity="0.8" />
  <circle cx="50" cy="24" r="1.4" fill="#ffffff" />

  <!-- Rear Caster Wheel Mount -->
  <circle cx="50" cy="76" r="3.2" fill="currentColor" opacity="0.8" />
  <circle cx="50" cy="76" r="1.4" fill="#ffffff" />

  <!-- Structural Plate Standoffs -->
  <circle cx="32" cy="38" r="2.2" fill="currentColor" opacity="0.6" />
  <circle cx="68" cy="38" r="2.2" fill="currentColor" opacity="0.6" />
  <circle cx="32" cy="64" r="2.2" fill="currentColor" opacity="0.6" />
  <circle cx="68" cy="64" r="2.2" fill="currentColor" opacity="0.6" />

  <!-- Front Vision / Depth Camera (Intel RealSense style) -->
  <rect x="36" y="16" width="28" height="6" rx="2" fill="var(--heading-secondary, #f09228)" />
  <circle cx="43" cy="19" r="1.5" fill="#ffffff" />
  <circle cx="57" cy="19" r="1.5" fill="#ffffff" />

  <!-- Central 2D LiDAR Scanner Unit (e.g. RPLiDAR / LDS Puck) -->
  <circle cx="50" cy="51" r="13" fill="currentColor" />
  <circle cx="50" cy="51" r="9" fill="#ffffff" opacity="0.18" />

  <!-- High-Speed Spinning LiDAR Optical Beam -->
  <g class="robot-lidar" style="transform-origin: 50px 51px;">
    <line x1="50" y1="51" x2="50" y2="15" stroke="var(--heading-secondary, #f09228)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <circle cx="50" cy="16" r="2.2" fill="var(--heading-secondary, #f09228)" />
  </g>

  <!-- Robot Status LED Beacon -->
  <circle cx="50" cy="70" r="2.2" fill="var(--heading-secondary, #f09228)" class="robot-beacon" />
</svg>

